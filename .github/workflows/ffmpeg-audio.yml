# Builds the audio-only, LGPL FFmpeg bundled with Echo (tools/ffmpeg-audio/build.sh).
# Run by hand from the Actions tab. The "ffmpeg-audio" artifact holds the binary, the license texts
# and the complete source used; tools/get-ffmpeg.ps1 -From <artifact folder> caches it, and
# publish.ps1 attaches binary and source to every Echo release.
name: ffmpeg-audio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm make xz-utils gnupg

      - name: Build
        working-directory: tools/ffmpeg-audio
        run: bash build.sh

      - name: Package
        working-directory: tools/ffmpeg-audio/out
        run: |
          VERSION=$(grep -m1 '^FFMPEG_VERSION=' ../build.sh | cut -d= -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -9 "ffmpeg-audio-$VERSION-win64.zip" ffmpeg.exe *.txt *.md
          sha256sum "ffmpeg-audio-$VERSION-win64.zip" src/* | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-audio
          path: |
            tools/ffmpeg-audio/out/ffmpeg-audio-*-win64.zip
            tools/ffmpeg-audio/out/SHA256SUMS.txt
            tools/ffmpeg-audio/out/src/*
